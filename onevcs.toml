# This repository's own warm-pool maintenance, declared for onevcs. onevcs pool
# maintenance reads this file from the publication checkout on the base branch,
# never from a session's branch, and runs `command` in each idle pool slot's
# worktree, never in a slot a session holds. The `pool-maintenance` recipe runs
# cargo-prune-superseded over this repository's cargo target dir: it removes each
# unit's superseded builds older than 2 days and keeps each unit's newest build
# plus every build modified within those 2 days.
schema_version = 1

[pool.maintain]
command = ["just", "pool-maintenance"]
timeout = "30m"
