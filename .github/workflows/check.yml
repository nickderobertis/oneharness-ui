name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_diagnostic:
        description: Run the sequential Mac assertions manually
        type: boolean
        default: false

# A newer pull-request push supersedes the older run. On main a run may be
# publishing a release, so it finishes; GitHub still replaces a queued run with
# the newest one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  macos-policy:
    name: classify macOS coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Classify repository Mac coverage
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just classify-macos-coverage

  macos-pr:
    name: sequential macOS PR assertions
    needs: macos-policy
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && needs.macos-policy.result == 'success' && needs.macos-policy.outputs.required == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.macos_diagnostic == true))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install Tauri prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Bootstrap clean checkout
        run: just bootstrap
      - name: Shared gate from explicit merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          NX_BASE="$base" NX_HEAD=HEAD just check-affected

      - name: Build native DMG
        env:
          BUNDLE_FORMATS: dmg
        run: just bundle
      - name: Prepare release-like assets and checksums
        env:
          BUNDLE_DIRECTORY: target/release/bundle
          RELEASE_ASSET_DIRECTORY: target/release-assets
          RELEASE_ASSET_FORMATS: dmg
          RELEASE_PLATFORM: macos-aarch64
          RELEASE_TAG: v0.1.0
        run: just prepare-release-assets
      - name: Mount, install, and verify native application
        run: just verify-macos-artifact

  macos-check:
    # llmlint: ignore[names_match_behavior] Branch protection requires this exact display name. This Linux carrier reports the separate macos-pr proof or an explicit authorized omission; it does not claim to execute native assertions.
    name: check (macos-15)
    needs: [macos-policy, macos-pr]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Report required Mac proof or authorized omission
        env:
          POLICY_RESULT: ${{ needs.macos-policy.result }}
          MAC_RESULT: ${{ needs.macos-pr.result }}
          MAC_REQUIRED: ${{ needs.macos-policy.outputs.required }}
        run: just macos-proof-result

  macos-native-smoke:
    # llmlint: ignore[names_match_behavior] Branch protection requires this exact display name. This Linux carrier reports the separate macos-pr native smoke proof or an explicit authorized omission; it does not claim to execute native assertions.
    name: macos-native-smoke
    needs: [macos-policy, macos-pr]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Report required Mac proof or authorized omission
        env:
          POLICY_RESULT: ${{ needs.macos-policy.result }}
          MAC_RESULT: ${{ needs.macos-pr.result }}
          MAC_REQUIRED: ${{ needs.macos-policy.outputs.required }}
        run: just macos-proof-result

  check:
    name: check (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install Tauri prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Bootstrap clean checkout
        run: just bootstrap
      - name: Shared gate from explicit merge base
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          NX_BASE="$base" NX_HEAD=HEAD just check-affected

  full-check:
    name: full-check (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install Tauri prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Bootstrap clean checkout
        run: just bootstrap
      - name: Full gate
        run: just check

  # The release sits after the broader tier: semantic-release runs for a commit
  # on main only when every full-check variant for that commit succeeded, so a
  # failed or cancelled sweep leaves the version job unstarted.
  version:
    name: version
    needs: full-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Install pinned workspace
        run: just bootstrap
      - name: Establish the initial pre-1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: just seed-release
      - name: Compute, tag, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just publish-release
      # Tags pushed with the built-in token emit no workflow events, so the
      # version job dispatches the artifact workflow itself.
      - name: Reconcile the latest native artifact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: just dispatch-release

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install tools
        run: cargo install just --locked --version 1.42.4
      - name: Bootstrap clean checkout
        run: just bootstrap
      - name: Dependency policy and audit
        run: just supply-chain


  install:
    name: install (${{ matrix.os }})
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.full-check.result == 'success')
    needs: full-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
            platform: linux-x86_64
            assets: appimage,deb
          - os: ubuntu-22.04-arm
            bundles: deb,appimage
            platform: linux-aarch64
            assets: appimage,deb
          - os: windows-2025
            bundles: msi,nsis
            platform: windows-x86_64
            assets: msi,nsis
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install Tauri prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          webkit2gtk-driver xvfb
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Bootstrap clean checkout
        run: just bootstrap
      - name: Build native installer
        env:
          BUNDLE_FORMATS: ${{ matrix.bundles }}
        run: just bundle
      - name: Prepare release-like assets and checksums
        env:
          BUNDLE_DIRECTORY: target/release/bundle
          RELEASE_ASSET_DIRECTORY: target/release-assets
          RELEASE_ASSET_FORMATS: ${{ matrix.assets }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: v0.1.0
        run: just prepare-release-assets
      - name: Select, verify, and install the Linux release asset
        if: runner.os == 'Linux'
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$RELEASE_PLATFORM" == "linux-aarch64" ]]; then
            install_root="$GITHUB_WORKSPACE/target/release"
          else
            install_root="$(mktemp -d)"
            trap 'rm -rf "$install_root"' EXIT
          fi
          ONEHARNESS_UI_RELEASE_BASE_URL="file://${GITHUB_WORKSPACE}/target/release-assets" \
            sh scripts/install.sh --version v0.1.0 --to "$install_root"
          test -x "$install_root/oneharness-ui"
      - name: Launch installed ARM64 AppImage without FUSE
        if: matrix.platform == 'linux-aarch64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ONEHARNESS_UI_E2E_PREBUILT: "1"
          ONEHARNESS_UI_E2E_STARTUP_ONLY: "1"
        run: xvfb-run -a just test-desktop-e2e
      - name: Install and verify Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem . -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI was built" }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI install failed: $($process.ExitCode)" }
          $installed = Get-ChildItem $env:ProgramFiles,$env:LOCALAPPDATA -Filter oneharness.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed oneharness.exe was not found" }
