name: desktop-e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # This is a deterministic, credential-free packaged journey: bootstrap builds
  # the oneharness provider fixture and ONEHARNESS_NO_CONFIG prevents paid or
  # developer-configured providers from entering the test boundary.
  #
  # The journey runs only when the change reaches desktop-shell-e2e in the Nx
  # graph. The skip is per step, never a job-level `if`: each matrix variant must
  # still report its required desktop-e2e (<os>) context on every pull request.
  desktop-e2e:
    name: desktop-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ONEHARNESS_NO_CONFIG: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install just
        run: cargo install just --locked --version 1.42.4
      - name: Install the locked workspace for selection
        run: just install-workspace
      - name: Select the journey from the affected project graph
        id: select
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          else
            base="$PUSH_BEFORE"
          fi
          NX_BASE="$base" NX_HEAD=HEAD just select-affected desktop-shell-e2e >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: steps.select.outputs.run == 'true'
        with:
          enable-cache: false
          version: 0.11.28
      - name: Install Linux desktop and WebDriver prerequisites
        if: steps.select.outputs.run == 'true' && runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y
          pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          webkit2gtk-driver xvfb
      - name: Bootstrap clean checkout
        if: steps.select.outputs.run == 'true'
        run: just bootstrap
      - name: Deterministic packaged desktop journey (Linux)
        if: steps.select.outputs.run == 'true' && runner.os == 'Linux'
        run: xvfb-run -a just test-desktop-e2e
      - name: Deterministic packaged desktop journey (Windows)
        if: steps.select.outputs.run == 'true' && runner.os == 'Windows'
        run: just test-desktop-e2e
      - name: Upload desktop failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: ignore
          name: desktop-e2e-${{ matrix.os }}
          path: test-results/desktop-e2e
