name: Visual docs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  # The reusable workflow isolates PR capture in a contents:read container job;
  # these writes are available only to its host-side gallery/comment report job.
  contents: write
  pull-requests: write

jobs:
  # Captures run only when the change reaches the conversation-ui-visual Nx
  # project, whose inputs are what the captures render. Visual docs is not a
  # required context, so a skipped capture job reports nothing anyone waits on.
  select:
    name: select
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      capture: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Select the capture from the affected project graph
        id: select
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          else
            base="$PUSH_BEFORE"
          fi
          bun install --frozen-lockfile --ignore-scripts >/dev/null
          NX_BASE="$base" NX_HEAD=HEAD bun scripts/select-affected.mjs conversation-ui-visual >> "$GITHUB_OUTPUT"

  # A closed pull request skips selection and still reaches the reusable
  # workflow, whose cleanup-preview job removes that pull request's gallery.
  visual-docs:
    needs: select
    if: ${{ !cancelled() && (github.event.action == 'closed' || needs.select.outputs.capture == 'true') }}
    uses: nickderobertis/screencomp/.github/workflows/visual-docs-reusable.yml@v0
    with:
      capture-command: bash capture.sh
      container: mcr.microsoft.com/playwright:v1.61.1-noble
      fail-on-drift: true
      screencomp-version: v0.4.2
